<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Boreal & Bean</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles-checkout.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">B &amp; B</a>
            <div>
                <a href="index.html" class="nav-link">Home</a>
                <a href="menu.html" class="nav-link">Menu</a>
                <a href="story.html" class="nav-link">Our Story</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="checkout.html" class="nav-link nav-checkout">Checkout</a>
            </div>
        </div>
    </nav>

    <!-- Checkout Section -->
    <div class="section">
        <h2 class="section-title">Complete Your Order</h2>

        <div class="checkout-container">
            <!-- Cart Summary -->
            <div class="cart-summary">
                <h3>Your Cart</h3>
                <p class="empty-cart">Your cart is empty.</p>
                <div class="total">Total: CA$0.00</div>
            </div>

            <!-- Payment Form -->
            <div class="payment-form">
                <h3>Payment Information</h3>
                <form onsubmit="handlePayment(event)">
                    <label>Cardholder Name</label>
                    <input type="text" placeholder="John Doe" required>

                    <label>Card Number</label>
                    <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" required>

                    <div class="form-row">
                        <div>
                            <label>Expiry Date (MM/YY)</label>
                            <input type="text" placeholder="MM/YY" maxlength="5" required>
                        </div>
                        <div>
                            <label>CVV</label>
                            <input type="text" placeholder="123" maxlength="4" required>
                        </div>
                    </div>

                    <button type="submit" class="pay-btn">PAY SECURELY</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Dark Footer Bar -->
    <footer class="dark-footer">
        <p>© 2026 Boreal &amp; Bean — Ontario, Canada • Rooted in the North, Roasted for the Soul</p>
    </footer>

</body>
</html>
